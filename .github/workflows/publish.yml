name: Publish to PyPI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install stapel-core (with channels extra for realtime)
        run: pip install "stapel-core[channels] @ git+https://github.com/usestapel/stapel-core.git"

      - name: Install
        run: pip install -e ".[all]" || pip install -e .

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check . --select E,F,W --ignore E501

      - name: Import check
        run: python -c "import stapel_chat; print('import OK')"

      # ONE declaration of what the suite needs, in pyproject's `test` extra —
      # never a hand-kept list in a workflow file that drifts from what the
      # tests actually import. 0.5.0 shipped red because no such declaration
      # existed and a sibling was imported anyway.
      - name: Install test dependencies (the declared `test` extra)
        run: pip install -e ".[test]"

      - name: Tests with coverage
        # Strict siblings: a declared sibling that is missing FAILS instead of
        # skipping. A quiet skip on CI means the install step above did not do
        # what it says, which is the other half of this defect class.
        env:
          STAPEL_TEST_STRICT_SIBLINGS: "1"
        run: |
          pytest tests/ \
            --cov=stapel_chat \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: coverage.xml
          flags: stapel-chat
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build --quiet
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
