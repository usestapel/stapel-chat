[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-chat"
version = "0.8.0"
description = "Conversations, messaging and support chat for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "chat", "messaging", "support"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Floor: 0.45.0 — the canonical SerializerSeamMixin/StapelAPIView
    # (0.37.0), the deletion gate whose reasoning the message tombstone reuses
    # (0.40.0 + its mint half in 0.41.0), the floor stapel-cdn 0.16.0 — whose
    # render metadata this module consumes — already stands on, and the
    # fleet-wide verification namespace 0.45.0 moved grants into. The last is
    # the reason this is a floor and not a preference: a deployment running
    # chat's block enforcement against a peer on <=0.44.2 has two halves of
    # the fleet disagreeing about who is verified.
    "stapel-core>=0.45.0,<1.0",
    # The WebSocket substrate. Not an extra: since 0.3.0 realtime is the
    # canonical path, and chat's stream keys, wire envelope and consumers are
    # all stapel-realtime's. Importing it costs nothing without Channels.
    "stapel-realtime>=0.1.2,<1.0",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-chat"
Repository = "https://github.com/usestapel/stapel-chat"
Documentation = "https://github.com/usestapel/stapel-chat#readme"
Changelog = "https://github.com/usestapel/stapel-chat/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-chat/issues"

[project.optional-dependencies]
# Serving the sockets needs Channels. This is not "realtime is optional" — a
# deployment without it fails `manage.py check` (stapel_chat.E010/E011) rather
# than degrading into a polling product. The extra exists because a build that
# only imports the models or the emit schemas should not pull an ASGI stack.
realtime = ["stapel-realtime[channels]>=0.1.2,<1.0"]
# Deprecated alias kept for one release.
channels = ["stapel-realtime[channels]>=0.1.2,<1.0"]
all = ["stapel-realtime[channels]>=0.1.2,<1.0"]
# What the TEST SUITE needs, as opposed to what the package needs. It is a
# declaration, not a convenience: every sibling any test imports belongs here,
# and tests/test_test_dependencies.py fails if one is missing. 0.5.0 shipped
# red on CI precisely because this list did not exist — the tests passed in a
# shared development virtualenv that happens to have the whole fleet
# installed, and a clean runner had none of it.
test = [
    "pytest",
    "pytest-django",
    "pytest-asyncio",
    "pytest-cov",
    "channels",
    "daphne",
    "stapel-tools>=0.9.1,<1",
    # The moderation queue the seam tests meet for real. Optional to the
    # package (moderation.py), required to prove interop — a fake would
    # assert nothing but this suite's own idea of the other side.
    # 0.3.1 is the floor: below it that module's own user.deleted handler
    # raises on a malformed id, so the poison-pill test here fails on its bug.
    "stapel-moderation>=0.3.1,<1.0",
    # The CDN whose media vocabulary chat's attachment types must equal
    # (0.4.0). Its two agreement tests were skipped on every CI run before
    # this extra existed, so the agreement they claim to enforce was enforced
    # nowhere.
    "stapel-cdn>=0.16.0,<1.0",
]

[tool.setuptools]
package-dir = {"stapel_chat" = "."}
packages = ["stapel_chat", "stapel_chat.migrations"]

[tool.setuptools.package-data]
stapel_chat = ["py.typed", "migrations/*.py", "schemas/**/*.json", "docs/capabilities.json", "docs/llms.txt", "docs/flows.json", "docs/errors.json", "CONFIG.MD"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
